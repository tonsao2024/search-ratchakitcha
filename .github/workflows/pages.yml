name: Sync real data and deploy Pages
on:
  push:
    branches: [arena/01a0d240-search-ratchakitcha]
  workflow_dispatch:
  schedule:
    - cron: '15 23 * * *' # 06:15 Asia/Bangkok; runs only once workflow is on default branch
permissions:
  contents: read
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: arena/01a0d240-search-ratchakitcha
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Install browser for readability checks
        run: npx playwright install --with-deps chromium
      - name: Check desktop and mobile readability
        run: npm run test:readability
      - uses: actions/cache@v4
        with:
          path: .cache/month-import
          key: historical-v3-${{ github.run_id }}
          restore-keys: historical-v3-
      - name: Download real metadata and OCR from Hugging Face
        run: npm run sync:data
      - name: Build static Pages website
        run: npm run build
        env:
          VITE_STATIC_DATA: 'true'
          VITE_BASE_PATH: /search-ratchakitcha/
      - name: Save verified data and website for inspection
        uses: actions/upload-artifact@v4
        with:
          name: real-data-site
          path: dist
          retention-days: 7
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
